[project]
name = "sentinel-vault"
version = "0.1.0"
description = "Multi-tenant encryption and PHI/PII protection service (POC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7,<3.9",
    "structlog>=24.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastembed>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
]
aws = ["aioboto3>=13"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sentinel_vault*", "customer_kms*", "mock_llm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
